<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>تحديث Sedra…</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
  body{background:linear-gradient(160deg,#143F63,#0E2F4B);color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .b{text-align:center;max-width:340px}
  .s{width:46px;height:46px;border:4px solid rgba(255,255,255,.22);border-top-color:#36C5E0;border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 20px}
  @keyframes sp{to{transform:rotate(360deg)}}
  h1{font-size:20px;margin-bottom:8px}
  p{opacity:.85;font-size:14px;line-height:1.7}
  .ok{color:#36C5E0;font-weight:800}
</style>
</head>
<body>
  <div class="b">
    <div class="s" id="spin"></div>
    <h1 id="t">بنحدّث النظام لآخر نسخة…</h1>
    <p id="m">لحظات بسيطة ويفتح لوحده. متقفلش الصفحة.</p>
  </div>
<script>
(async function(){
  try{
    if('serviceWorker' in navigator){
      var regs = await navigator.serviceWorker.getRegistrations();
      for(var i=0;i<regs.length;i++){ try{ await regs[i].unregister(); }catch(e){} }
    }
  }catch(e){}
  try{
    if(window.caches && caches.keys){
      var ks = await caches.keys();
      await Promise.all(ks.map(function(k){ return caches.delete(k); }));
    }
  }catch(e){}
  try{
    document.getElementById('spin').style.borderTopColor='#7CE0A0';
    document.getElementById('t').innerHTML='<span class="ok">تم التحديث ✅</span>';
    document.getElementById('m').textContent='بنفتح النسخة الجديدة دلوقتي…';
  }catch(e){}
  setTimeout(function(){ location.replace('/?fresh=' + Date.now()); }, 1000);
})();
</script>
</body>
</html>
