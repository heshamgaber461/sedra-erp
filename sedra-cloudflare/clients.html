<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sedra — حسابات العملاء</title>
<style>
  :root{--navy:#143F63;--navy2:#0E2C49;--cyan:#36C5E0;--ink:#16242f;--line:#e6eaef;--muted:#5A6B7B;--bg:#f4f6f9}
  *{box-sizing:border-box}
  body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink);line-height:1.6}
  header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;justify-content:space-between}
  header h1{font-size:18px;margin:0;font-weight:700}
  header .who{font-size:13px;opacity:.9}
  .wrap{max-width:900px;margin:0 auto;padding:20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 1px 3px rgba(20,63,99,.05)}
  .card h2{font-size:16px;margin:0 0 14px;color:var(--navy)}
  label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--navy2)}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fbfcfe}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:620px){.row,.row3{grid-template-columns:1fr}}
  .btn{background:var(--navy);color:#fff;border:0;padding:12px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
  .btn:hover{background:#0f3350}.btn:disabled{opacity:.6;cursor:default}
  .btn.sec{background:#eef2f6;color:var(--navy)}
  .note{font-size:13px;padding:10px 12px;border-radius:9px;margin-top:10px;display:none}
  .note.ok{background:#e7f6ec;color:#176b38;display:block}
  .note.err{background:#fdeaea;color:#a12626;display:block}
  .chk{display:flex;align-items:center;gap:8px;margin:6px 0}
  .chk input{width:auto}
  .chkgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:4px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600}
  .pill{font-size:12px;padding:2px 9px;border-radius:20px;font-weight:600}
  .pill.on{background:#e7f6ec;color:#176b38}.pill.off{background:#fdeaea;color:#a12626}
  .mini{background:#eef2f6;color:var(--navy);border:0;padding:5px 10px;border-radius:7px;cursor:pointer;font:inherit;font-size:12px}
  .hide{display:none}
  .gate{max-width:380px;margin:60px auto}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:8px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
  small.hint{color:var(--muted);font-size:12px;font-weight:400}
</style>
</head>
<body>

<header>
  <div class="brand"><div class="logo">S</div><h1>سيدرا — حسابات العملاء</h1></div>
  <div class="who"><span id="whoTxt"></span> <button id="logoutBtn" class="mini hide" onclick="doLogout()">خروج</button></div>
</header>

<!-- LOGIN GATE -->
<div id="gate" class="wrap gate">
  <div class="card">
    <h2>دخول الأدمن</h2>
    <label>الإيميل</label>
    <input id="g_email" type="email" autocomplete="username" placeholder="admin@email.com">
    <label>كلمة المرور</label>
    <input id="g_pass" type="password" autocomplete="current-password" placeholder="••••••••">
    <div style="margin-top:14px"><button id="g_btn" class="btn" onclick="doLogin()">دخول</button></div>
    <div id="g_note" class="note"></div>
    <p style="margin-top:12px"><small class="hint">الصفحة دي لإدارة حسابات عملاء التطبيق — للأدمن فقطق.</small></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="wrap hide">

  <div class="card">
    <h2>إنشاء حساب عميل جديد</h2>
    <div class="row">
      <div><label>اسم العميل *</label><input id="c_name" placeholder="الاسم بالكامل"></div>
      <div><label>الفرع</label>
        <select id="c_branch"><option value="Egypt">مصر</option><option value="UAE">الإمارات</option><option value="KSA">السعودية</option></select>
      </div>
    </div>
    <div class="row">
      <div><label>الإيميل * <small class="hint">(هيسجّل بيه الدخول)</small></label><input id="c_email" type="email" placeholder="client@email.com"></div>
      <div><label>التليفون</label><input id="c_phone" placeholder="01xxxxxxxxx"></div>
    </div>
    <div class="row">
      <div><label>كلمة المرور *</label><input id="c_pass" placeholder="٨ حروف على الأقل"></div>
      <div style="display:flex;align-items:flex-end"><button class="btn sec" type="button" onclick="genPass()" style="width:100%">توليد كلمة مرور</button></div>
    </div>

    <h2 style="margin-top:20px;font-size:14px">🏠 بيانات الفيلا / العقار</h2>
    <div class="row">
      <div><label>العنوان</label><input id="v_addr" placeholder="المدينة / الكمبوند / العنوان"></div>
      <div><label>النوع</label>
        <select id="v_type"><option value="Villa">فيلا</option><option value="Apartment">شقة</option><option value="Company">شركة</option><option value="Other">أخرى</option></select>
      </div>
    </div>
    <div class="row">
      <div><label>المساحة / عدد الغرف</label><input id="v_area" placeholder="مثال: 300م² · 5 غرف"></div>
      <div><label>تاريخ التركيبت</label><input id="v_install" type="date"></div>
    </div>
    <label>الأنظمة المركّبة</label>
    <div class="chkgrid">
      <label class="chk"><input type="checkbox" class="sys" value="Home Automation"> أتمتة المنزل</label>
      <label class="chk"><input type="checkbox" class="sys" value="Security"> أنظمة الأمان</label>
      <label class="chk"><input type="checkbox" class="sys" value="Solar"> الطاقة الشمسية</label>
      <label class="chk"><input type="checkbox" class="sys" value="MEP"> MEP</label>
      <label class="chk"><input type="checkbox" class="sys" value="Networking"> الشبكات</label>
      <label class="chk"><input type="checkbox" class="sys" value="Audio/Video"> الصوت والصورة</label>
    </div>

    <h2 style="margin-top:20px;font-size:14px">📋 العقد والصيانة</h2>
    <div class="row3">
      <div><label>رقم العقد</label><input id="k_num" placeholder="اختياري"></div>
      <div><label>باقة الصيانة</label>
        <select id="k_plan"><option value="">بدون</option><option value="Basic">Basic</option><option value="Plus">Plus</option></select>
      </div>
      <div><label>الفرع المسؤول</label><input id="k_team" placeholder="اختياري"></div>
    </div>
    <div class="row">
      <div><label>آخر صيانة</label><input id="k_last" type="date"></div>
      <div><label>الصيانة الجاية</label><input id="k_next" type="date"></div>
    </div>

    <div style="margin-top:18px"><button id="createBtn" class="btn" onclick="createClient()">✅ إنشاء الحساب وتفعيله</button></div>
    <div id="c_note" class="note"></div>
  </div>

  <div class="card">
    <h2>حسابات العملاء الحالية <button class="mini" onclick="loadList()" style="float:left">تحديث</button></h2>
    <div id="listWrap"><p style="color:var(--muted)">جارِ التحميل…</p></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
var firebaseConfig={apiKey:"AIzaSyBAz-utB_Wbu6J7CQ8hy7mBCMlJvYjsUw4",authDomain:"sedra-crm.firebaseapp.com",databaseURL:"https://sedra-crm-default-rtdb.firebaseio.com",projectId:"sedra-crm",storageBucket:"sedra-crm.firebasestorage.app",messagingSenderId:"501278440253",appId:"1:501278440253:web:fd2f5783242afb2d15a354"};
firebase.initializeApp(firebaseConfig);
var auth=firebase.auth();
var SUPER_ADMIN_EMAIL="heshamgaber461@gmail.com";
var ADMIN_ROLES={'Super Admin':1,'CO Founder':1,'CEO':1,'Director':1,'Manager':1}; // who may provision
var me=null;

function $(id){return document.getElementById(id);}
function note(id,msg,ok){var n=$(id);n.textContent=msg;n.className='note '+(ok?'ok':'err');}
function T(id,show){$( id ).classList[show?'remove':'add']('hide');}

/* ---- data proxy (same secure gateway as the ERP) ---- */
async function db(method,path,body){
  var t=await auth.currentUser.getIdToken();
  var r=await fetch('https://sedraelectric.pages.dev/db',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t,method:method,path:path,body:body})});
  var txt=await r.text();
  if(!r.ok) throw new Error('('+r.status+') '+txt);
  return txt?JSON.parse(txt):null;
}

/* ---- auth ---- */
async function doLogin(){
  var em=$('g_email').value.trim(), pw=$('g_pass').value;
  if(!em||!pw){note('g_note','اكتب الإيميل وكلمة المرور.',false);return;}
  $('g_btn').disabled=true;
  try{ await auth.signInWithEmailAndPassword(em,pw); }
  catch(e){ note('g_note','تعذّر الدخول. راجع البيانات.',false); $('g_btn').disabled=false; }
}
function doLogout(){ auth.signOut(); }

async function resolveAdmin(u){
  if(String(u.email||'').toLowerCase()===SUPER_ADMIN_EMAIL.toLowerCase()) return {name:'Super Admin',role:'Super Admin'};
  var emps=await db('GET','/employees.json',undefined)||{};
  var found=null;
  for(var k in emps){ var e=emps[k]; if(e&&String(e.email||'').toLowerCase()===String(u.email||'').toLowerCase()){ found=e; break; } }
  if(found && ADMIN_ROLES[found.role]) return found;
  return null;
}

auth.onAuthStateChanged(async function(u){
  if(!u){ me=null; T('gate',true); T('app',false); $('whoTxt').textContent=''; $('logoutBtn').classList.add('hide'); return; }
  try{
    me=await resolveAdmin(u);
    if(!me){ note('g_note','الحساب ده مش مصرّح له بإدارة العملاء.',false); T('gate',true); T('app',false); setTimeout(function(){auth.signOut();},1500); return; }
    $('whoTxt').textContent=(me.name||u.email)+' · '+me.role;
    $('logoutBtn').classList.remove('hide');
    T('gate',false); T('app',true);
    loadList();
  }catch(e){ note('g_note','تعذّر التحقق من الصلاحية: '+e.message,false); }
});

/* ---- provisioning ---- */
function genPass(){
  var cs='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  var p=''; for(var i=0;i<10;i++) p+=cs[Math.floor(Math.random()*cs.length)];
  $('c_pass').value=p;
}
function sysList(){ return [].slice.call(document.querySelectorAll('.sys:checked')).map(function(c){return c.value;}); }

async function createClient(){
  var name=$('c_name').value.trim(), email=$('c_email').value.trim().toLowerCase(), phone=$('c_phone').value.trim(), pass=$('c_pass').value;
  if(!name||!email||!pass){ note('c_note','الاسم والإيميل وكلمة المرور مطلوبين.',false); return; }
  if(pass.length<8){ note('c_note','كلمة المرور لازم ٨ حروف على الأقل.',false); return; }
  $('createBtn').disabled=true; note('c_note','جارِ الإنشاءؠ*',true);
  var sec=null, uid=null;
  try{
    try{ sec=firebase.app('prov'); }catch(e){ sec=firebase.initializeApp(firebaseConfig,'prov'); }
    try{
      var cr=await sec.auth().createUserWithEmailAndPassword(email,pass);
      uid=cr.user.uid;
      try{ await cr.user.updateProfile({displayName:name}); }catch(_e){}
    }catch(e){
      if(e&&e.code==='auth/email-already-in-use'){ note('c_note','الإيميل در له حساب بالفعل. استخدم "استعادة كلمة المرور" من التطبيق أو إيميل تاني.',false); $('createBtn').disabled=false; return; }
      throw e;
    }
    await sec.auth().signOut();
    var profile={
      role:'customer', active:true,
      name:name, email:email, phone:phone, branch:$('c_branch').value,
      villa:{ address:$('v_addr').value.trim(), type:$('v_type').value, area:$('v_area').value.trim(), systems:sysList(), installDate:$('v_install').value||'' },
      contract:{ number:$('k_num').value.trim(), plan:$('k_plan').value, team:$('k_team').value.trim(), lastService:$('k_last').value||'', nextService:$('k_next').value||'' },
      provisionedBy:(me&&me.name)||'', provisionedByEmail:(auth.currentUser.email||''), createdAt:new Date().toISOString()
    };
    await db('PUT','/clientspace/'+uid+'/profile.json',profile);
    await db('PUT','/clientaccounts/'+uid+'.json',{uid:uid,name:name,email:email,phone:phone,branch:profile.branch,plan:profile.contract.plan,active:true,createdAt:profile.createdAt});
    note('c_note','✅ اتعمل حساب العميل وتفعّل: '+email,true);
    clearForm();
    loadList();
  }catch(e){
    note('c_note','حصل خطأ: '+(e&&e.message||e),false);
  }finally{ $('createBtn').disabled=false; }
}

function clearForm(){
  ['c_name','c_email','c_phone','c_pass','v_addr','v_area','v_install','k_num','k_team','k_last','k_next'].forEach(function(id){$(id).value='';});
  document.querySelectorAll('.sys:checked').forEach(function(c){c.checked=false;});
}

async function loadList(){
  var w=$('listWrap'); w.innerHTML='<p style="color:var(--muted)">جارِ التحميل…</p>';
  try{
    var o=await db('GET','/clientaccounts.json',undefined)||{};
    var arr=[]; for(var k in o){ if(o[k]) arr.push(Object.assign({_id:k},o[k])); }
    arr.sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
    if(!arr.length){ w.innerHTML='<p style="color:var(--muted)">لسه مفيش حسابات عملاء.</p>'; return; }
    var h='<table><tr><th>الاسم</th><th>الإيميل</th><th>الفرع</th><th>الباقة</th><th>الحالة</th><th></th></tr>';
    arr.forEach(function(c){
      h+='<tr><td>'+esc(c.name)+'</td><td>'+esc(c.email)+'</td><td>'+esc(c.branch||'')+'</td><td>'+esc(c.plan||'—')+'</td>'
        +'<td><span class="pill '+(c.active?'on':'off')+'">'+(c.active?'مُفعّل':'موقوف')+'</span></td>'
        +'<td><button class="mini" onclick="toggleActive(\''+c._id+'\','+(c.active?'false':'true')+')">'+(c.active?'إيقاف':'تفعيل')+'</button></td></tr>';
    });
    h+='</table>';
    w.innerHTML=h;
  }catch(e){ w.innerHTML='<p style="color:#a12626">تعذّر التحميل: '+esc(e.message)+'</p>'; }
}

async function toggleActive(uid,to){
  to=(to===true||to==='true');
  try{
    await db('PATCH','/clientspace/'+uid+'/profile.json',{active:to});
    await db('PATCH','/clientaccounts/'+uid+'.json',{active:to});
    loadList();
  }catch(e){ alert('تعذّر التعديل: '+e.message); }
}

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
</script>
</body>
</html>
